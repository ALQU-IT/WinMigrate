name: Build the Windows executable

# The whole point of this tool is that someone can put it on a USB stick and run
# it on a machine that has no Python. That means a real .exe, built on Windows,
# with the same tests behind it as everything else -- so the build runs the
# suite first and refuses to package a version that does not pass.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where it runs; Linux is where most of the development
        # happens. Several bugs in this project only appeared on one of them,
        # so both are checked on every push.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyflakes
      - name: Lint
        run: python -m pyflakes winmigrate tests
      - name: Tests
        run: python -m pytest -q
        env:
          WINMIGRATE_ALLOW_NON_WINDOWS: "1"

  build:
    name: WinMigrate.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import winmigrate; print(winmigrate.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "winmigrate $v"

      # One file, with everything inside it.
      #
      # --onefile unpacks into a temporary directory at every launch and loads
      # Tcl from there, and the default temporary directory is the problem: when
      # this program relaunches itself as administrator to get a shadow copy,
      # the elevated copy is handed C:\Windows\Temp instead of the user's own.
      # That directory is shared, more tightly ACL'd and aggressively cleaned,
      # and the result was "Can't find a usable init.tcl" from an executable
      # that had just worked.
      #
      # --runtime-tmpdir pins the unpacking somewhere the user always owns, so
      # elevating does not move it. The documentation only implies that Windows
      # expands environment variables here -- it states the opposite for POSIX
      # and says nothing for Windows -- so the step after this proves it rather
      # than trusting it.
      - name: Build the window
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name WinMigrate
          --collect-submodules winmigrate
          --collect-all tkinter
          --hidden-import tkinter
          --hidden-import tkinter.ttk
          --hidden-import tkinter.filedialog
          --hidden-import tkinter.messagebox
          --runtime-tmpdir "%LOCALAPPDATA%\WinMigrate"
          gui_entry.py

      - name: Build the console tool
        run: >
          pyinstaller --noconfirm --clean --onefile --console
          --name winmigrate-cli
          --collect-submodules winmigrate
          cli_entry.py

      - name: Check the console build actually starts
        shell: pwsh
        run: |
          # A build that imports cleanly on the runner but dies on a missing
          # hidden import is the classic PyInstaller failure, and it only shows
          # up when the thing is run. So run it.
          & ".\dist\winmigrate-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the console build does not start" }
          & ".\dist\winmigrate-cli.exe" presets
          if ($LASTEXITCODE -ne 0) { throw "presets failed" }

      - name: Prove tkinter survives, and that it unpacks where we said
        shell: pwsh
        run: |
          # Two things are being established here, and the second is the one
          # that broke on a real machine.
          #
          # 1. tkinter and its Tcl data are inside the executable. --windowed
          #    turns an import failure into a message box no runner will see,
          #    so the same imports are exercised through a console build.
          # 2. --runtime-tmpdir actually redirects the unpacking, environment
          #    variable and all. If Windows does not expand it, the folder that
          #    appears is named literally "%LOCALAPPDATA%" and the check fails
          #    here rather than on someone's machine when they click Yes on a
          #    UAC prompt.
          $probe = "$env:LOCALAPPDATA\WinMigrateProbe"
          if (Test-Path $probe) { Remove-Item $probe -Recurse -Force }

          pyinstaller --noconfirm --clean --onefile --console --name tkcheck `
            --collect-submodules winmigrate --collect-all tkinter `
            --hidden-import tkinter `
            --runtime-tmpdir "%LOCALAPPDATA%\WinMigrateProbe" tkcheck_entry.py

          & ".\dist\tkcheck.exe"
          if ($LASTEXITCODE -ne 0) { throw "tkinter did not survive freezing" }

          if (Test-Path ".\%LOCALAPPDATA%") {
            throw "--runtime-tmpdir was taken literally: Windows did not expand the variable, so an elevated run would unpack somewhere unintended"
          }
          if (-not (Test-Path $probe)) {
            throw "--runtime-tmpdir did not redirect the unpacking; $probe was never created"
          }
          Write-Host "unpacked into $probe as intended"
          Remove-Item $probe -Recurse -Force -ErrorAction SilentlyContinue

      - name: Lay out the package
        shell: pwsh
        run: |
          # Flat, and NOT zipped here: upload-artifact always zips what it is
          # given, so handing it a .zip produces a zip inside a zip -- which is
          # how someone ends up running the program from inside Explorer's zip
          # viewer.
          $staging = ".\staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item .\dist\WinMigrate.exe -Destination $staging -Force
          Copy-Item .\dist\winmigrate-cli.exe -Destination $staging -Force

          @"
          WinMigrate
          ==========

          WinMigrate.exe        the window. Start here.
          winmigrate-cli.exe    the same thing on the command line.

          Each is a single self-contained file. Copy either one anywhere and it
          will run; nothing needs to sit beside it.

          Windows will ask for administrator rights. That is what allows a
          shadow copy, which is the only way to copy files your browser and
          Outlook are holding open. Saying no still makes a backup; those files
          are listed at the end as skipped.

          IF WINDOWS BLOCKS IT FROM A USB DRIVE
          These files are not code-signed, and some machines run a Defender rule
          called "Block untrusted and unsigned processes that run from USB".
          Copy the file to the computer's own disk and run it from there, or ask
          whoever administers the machine to allow it.
          "@ | Set-Content -Encoding UTF8 "$staging\READ ME FIRST.txt"

          Get-FileHash "$staging\WinMigrate.exe", "$staging\winmigrate-cli.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content "$staging\SHA256SUMS.txt"

          Get-ChildItem $staging | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}} | Format-Table

      - name: Check the package is what it claims to be
        shell: pwsh
        run: |
          foreach ($required in @("WinMigrate.exe", "winmigrate-cli.exe", "READ ME FIRST.txt", "SHA256SUMS.txt")) {
            if (-not (Test-Path ".\staging\$required")) { throw "$required is missing from the package" }
          }
          if (Get-ChildItem .\staging -Filter *.zip) { throw "a zip inside the package: it would nest when uploaded" }
          # Self-contained means self-contained: anything else next to the exe
          # is something a user can copy without, and then it is broken.
          if (Test-Path ".\staging\_internal") { throw "_internal is present; this build is not self-contained" }

      - uses: actions/upload-artifact@v7
        with:
          name: WinMigrate-${{ steps.version.outputs.version }}-windows
          path: staging/*
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: WinMigrate-*-windows
          merge-multiple: true
          path: package
      - name: Collect the assets
        run: |
          # Two self-contained executables, attached as themselves. No archive:
          # a zip is one more thing for someone to run the program from inside.
          cp package/WinMigrate.exe package/winmigrate-cli.exe package/SHA256SUMS.txt .
          ls -lh WinMigrate.exe winmigrate-cli.exe
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            WinMigrate.exe
            winmigrate-cli.exe
            SHA256SUMS.txt
          body: |
            Windows build of WinMigrate. Neither download needs Python installed.

            - `WinMigrate.exe` — the window. One self-contained file; copy it
              anywhere and run it.
            - `winmigrate-cli.exe` — the same thing on the command line, for
              scripted runs.

            Check `SHA256SUMS.txt` against your download before running either.

            The window asks for administrator rights when it starts, which is
            what allows a shadow copy — the only way to copy files your browser
            and Outlook are holding open. Saying no still produces a backup;
            those files are listed at the end as skipped.

            These builds are not code-signed. Some machines run a Defender rule
            called "Block untrusted and unsigned processes that run from USB",
            which will stop the file running from a removable drive; copy it to
            the computer's own disk first, or have the machine's administrator
            allow it.
